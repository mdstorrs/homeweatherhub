<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Weather Hub - Site Settings</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  </head>
  <body>

  <div id="mySidebar" class="sidebar">
    <a href="javascript:void(0)" class="closebtn">×</a>
    <a href="index.html"><i class="fas fa-satellite-dish"></i><span>Stations</span></a>
    <a href="current.html" id="currentLink" class="conditional-link"><i class="fas fa-thermometer-half"></i><span>Current</span></a>
    <a href="history.html" id="historyLink" class="conditional-link"><i class="fas fa-history"></i><span>History</span></a>
    <div id="settings">
      <a href="account.html"><i class="fas fa-user"></i><span>Account</span></a>
      <a href="settings.html"><i class="fas fa-cog"></i><span>Settings</span></a>
    </div>
  </div>

  <div class="cs-header-container">
    <h1>
      <button type="button" class="openbtn" aria-label="Open menu">☰</button>
      Home Weather Hub
    </h1>
  </div>

  <div class="cs-settings-main">
    
    <div class="cs-section-div">

      <div class="toggle-container">
        <button type="button" class="toggle-option selected" id="celsius">°C</button>
        <button type="button" class="toggle-option" id="fahrenheit">°F</button>
      </div>

      <p id="selected-unit">Metric System Selected</p>

    </div>

  </div>

  <script type="module" src="scripts/main.js"></script>
  <script type="module" src="scripts/settings.js"></script>

  </body>
</html>
